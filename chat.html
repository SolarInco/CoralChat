<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REVOLT CHAT - Room</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<div id="particles-js"></div>
<div class="wave-bg"></div>

<div id="chatpage" class="page-container">
  <div class="chat-header">
    <div class="header-left">
      <a href="index.html" class="box-back-btn"><i data-lucide="arrow-left"></i></a>
      <a href="index.html" class="header-logo">REVOLT CHAT</a>
    </div>
  </div>
  
  <div class="chat-body">
    <div class="sidebar left-sidebar">
      <div class="room active">Global Room</div>
    </div>
    
    <div class="chat-area">
      <div class="messages" id="messages-container"></div>
      
      <div class="input-area">
        <input type="text" id="message-input" placeholder="Type a message...">
        <button id="send-btn">Send</button>
      </div>
    </div>
    
    <div class="sidebar right-sidebar">
      <div class="online-header" id="online-count">0 revolters online</div>
      <div id="online-users-list"></div>
    </div>
  </div>
</div>

<script src="shared.js"></script>
<script type="module" src="chat.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
