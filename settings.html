<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoralChat - Settings</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
</head>
<body>

<div id="particles-js"></div>
<div class="wave-bg"></div>

<div class="top-nav-area">
  <a href="index.html" class="box-back-btn nav-link"><i data-lucide="arrow-left"></i></a>
</div>

<div id="settings-popup">Settings saved and applied</div>

<div id="loading-screen">
  <div class="spinner"></div>
</div>

<div id="settingspage" class="page-container">
  <div class="settings-container large-settings">
    <h2>Themes</h2>
    <div class="theme-boxes">
      <div class="theme-box" data-theme="darkgreen" style="background: black; color: #00FF00; border-color: #00FF00;">Darkgreen</div>
      <div class="theme-box" data-theme="usa" style="background: repeating-linear-gradient(45deg, red, red 10px, blue 10px, blue 20px); color: white;">USA</div>
      <div class="theme-box" data-theme="amber" style="background: #FFBF00; color: black; border-color: black;">Amber</div>
      <div class="theme-box" data-theme="lightgreen" style="background: white; color: #90EE90; border-color: #90EE90;">LightGreen</div>
      <div class="theme-box" data-theme="rose" style="background: #FFC0CB; color: white; border-color: white;">Rose</div>
      <div class="theme-box" data-theme="default" style="background: #ADD8E6; color: #00008B;">Default</div>
    </div>
    
    <h2>Environment</h2>
    <div class="toggle-group">
      <label for="toggle-particles">Black Firefly Particles</label>
      <input type="checkbox" id="toggle-particles">
    </div>

    <div class="settings-actions">
      <button id="save-btn" class="save-btn">Save Settings</button>
    </div>
  </div>
</div>

<script src="shared.js"></script>
<script src="settings.js"></script>
</body>
</html>
