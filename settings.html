<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REVOLT CHAT - Settings</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<div id="particles-js"></div>
<div class="wave-bg"></div>

<div class="top-nav-area">
  <a href="index.html" class="box-back-btn"><i data-lucide="arrow-left"></i></a>
</div>

<div id="settingspage" class="page-container">
  <div class="large-settings">
    
    <div class="theme-boxes">
      <div class="theme-box selected" data-theme="default" style="background: black; color: #e60000; border-color: #e60000;">Revolt (Default)</div>
      <div class="theme-box" data-theme="coral" style="background: #ADD8E6; color: #00008B;">Coral</div>
      <div class="theme-box" data-theme="darkgreen" style="background: black; color: #00FF00;">Matrix</div>
      <div class="theme-box" data-theme="usa" style="background: transparent; color: white;">USA</div>
      <div class="theme-box" data-theme="amber" style="background: #FFBF00; color: black;">Amber</div>
      <div class="theme-box" data-theme="lightgreen" style="background: white; color: #90EE90;">Mint</div>
      <div class="theme-box" data-theme="rose" style="background: #FFC0CB; color: white;">Rose</div>
    </div>
    
    <div class="settings-actions">
      <button class="save-btn" id="save-settings-btn">Save Changes</button>
    </div>
    
  </div>
</div>

<script src="shared.js"></script>
<script>
  lucide.createIcons();
  
  const boxes = document.querySelectorAll('.theme-box');
  const currentTheme = localStorage.getItem('revolt_theme') || 'default';
  
  boxes.forEach(box => {
    if(box.dataset.theme === currentTheme) {
      boxes.forEach(b => b.classList.remove('selected'));
      box.classList.add('selected');
    }
    
    box.addEventListener('click', () => {
      boxes.forEach(b => b.classList.remove('selected'));
      box.classList.add('selected');
      document.body.className = box.dataset.theme === 'default' ? '' : `theme-${box.dataset.theme}`;
      localStorage.setItem('revolt_theme', box.dataset.theme);
    });
  });
</script>
</body>
</html>
